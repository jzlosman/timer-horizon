<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#060504" />
    <meta name="description" content="Quantifying every moment." />
    <link rel="canonical" href="https://timer-horizon.jeremy-134.workers.dev" />
    <meta property="og:title" content="Timer Horizon" />
    <meta property="og:description" content="Quantifying every moment." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://timer-horizon.jeremy-134.workers.dev" />
    <meta property="og:image" content="https://timer-horizon.jeremy-134.workers.dev/assets/social-share.png" />
    <meta property="og:image:width" content="1920" />
    <meta property="og:image:height" content="1008" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Timer Horizon" />
    <meta name="twitter:description" content="Quantifying every moment." />
    <meta name="twitter:image" content="https://timer-horizon.jeremy-134.workers.dev/assets/social-share.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Familjen+Grotesk:ital,wght@0,400;0,450;0,500;0,600;1,400&display=swap" rel="stylesheet" />
    <title>Timer Horizon</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="no-webgl">
    <audio id="background-audio" loop preload="auto">
      <source src="./assets/background.mp3" type="audio/mpeg" />
    </audio>
    <canvas id="field" aria-hidden="true"></canvas>
    <main id="experience" aria-label="Timer Horizon">
      <p class="wordmark" aria-hidden="true">Timer Horizon</p>
      <button id="sound-toggle" class="sound-toggle" type="button" aria-pressed="false" aria-label="Turn background sound on">Sound off</button>
      <button id="fact-offer" class="fact-offer" type="button" aria-haspopup="dialog">Offer a fact</button>
      <section id="facts" aria-label="Live rate facts"></section>
      <div class="horizon" aria-hidden="true"><div class="fallback-ring"></div></div>
      <button id="timer" class="timer" type="button" aria-haspopup="dialog" aria-label="Change the timer starting time">
        <span id="duration">0 seconds</span>
        <span class="timer-caption">since you arrived</span>
      </button>
      <p class="field-instruction" aria-hidden="true">click the field to draw another current</p>
    </main>

    <dialog id="start-dialog" aria-labelledby="dialog-title">
      <form id="start-form" method="dialog">
        <p class="dialog-kicker">Timer Horizon</p>
        <h1 id="dialog-title">Choose a beginning.</h1>
        <label for="start-time">Start time</label>
        <input id="start-time" name="start-time" type="datetime-local" required />
        <p id="start-error" class="dialog-error" role="alert"></p>
        <div class="dialog-actions">
          <button value="cancel" type="button" id="cancel-start">Keep this visit</button>
          <button value="confirm" type="submit">Set horizon</button>
        </div>
      </form>
    </dialog>

    <dialog id="fact-dialog" aria-labelledby="fact-dialog-title">
      <p class="dialog-kicker">Timer Horizon</p>
      <h2 id="fact-dialog-title">Suggest a fact.</h2>
      <p class="fact-dialog-copy">Post a fact you’d like included, with its rate, a trustworthy source, and your preferred credit.</p>
      <div class="dialog-actions">
        <button id="cancel-fact-offer" type="button">Return to the field</button>
        <a id="fact-offer-link" href="https://x.com/intent/post?text=%40node_jz%20I%20have%20a%20fact%20suggestion%20for%20Timer%20Horizon%3A%0A%0AFact%3A%20%0ARate%3A%20%0ASource%3A%20%0ACredit%3A%20" target="_blank" rel="noopener noreferrer">Suggest on X</a>
      </div>
    </dialog>

    <script type="module" src="./src/main.mjs"></script>
  </body>
</html>
